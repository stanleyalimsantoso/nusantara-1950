<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body><title>Nusantara 1950</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,500;1,400&family=Special+Elite&display=swap">
<style>
/* Layout A, war-table version: a wooden desk seen from above. The map is a pinned paper sheet on it, props sit around the edges, the log is a telegram (bottom left), the controls a ledger (bottom right), and the hand has its own strip between them. One deliberate dark look in every theme. */
:root {
  --table: #2b2117; --table-2: #3a2d1f; --rim: #4a3a28;
  --paper: #efe3c6; --paper-2: #f6eedb; --line: #b89f70;
  --ink: #3b2c1c; --ink-soft: #6f5b40; --cream: #efe3c6; --cream-soft: #c9b58c;
  --gov: #d6907f; --gov-ink: #8c3b2c; --sep: #6f9447; --sep-ink: #3f5e2c; --imp: #e9a45c; --imp-ink: #8a5216;
  --gold: #e8c35a; --danger: #b5463c;
  --f-display: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-italic: "IM Fell English", Georgia, serif;
  --f-body: "Spectral", Georgia, "Times New Roman", serif;
  --f-type: "Special Elite", "Courier New", Courier, monospace;
  --u: 1;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--table); color: var(--cream); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
button { font-family: var(--f-body); }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: #241b12; border-bottom: 1px solid var(--rim); }
.brand { font-family: var(--f-display); font-size: 18px; letter-spacing: .08em; color: var(--cream); }
.turninfo { font-size: 14px; color: var(--cream-soft); font-variant-numeric: tabular-nums; }
.turninfo b { color: var(--cream); font-weight: 500; }
.dip { display: flex; align-items: center; gap: 8px; margin-inline: auto; }
.dip-label { font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; color: var(--cream-soft); }
.dip-bar { display: grid; grid-auto-flow: column; grid-auto-columns: 16px; gap: 3px; }
.dip-bar i { height: 15px; border-radius: 2px; background: #4b3c2a; border: 1px solid #5c4a34; }
.dip-bar i.on { background: var(--gold); border-color: #b5913a; }
.dip-bar i.warn.on { background: #d9844a; border-color: #a85e2e; }
.dip-bar i.crit.on { background: var(--danger); border-color: #7d2a22; }
.dip-num { font-variant-numeric: tabular-nums; font-size: 14px; min-width: 40px; }
.rivals { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; font-size: 13px;
  border: 1px solid var(--rim); background: #33281b; color: var(--cream-soft); font-variant-numeric: tabular-nums; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip.gov .dot { background: var(--gov); } .chip.sep .dot { background: var(--sep); } .chip.imp .dot { background: var(--imp); }
.chip.active { border-color: var(--gold); color: var(--cream); }
.chip.me { background: #45362a; }
.chip .on-line { width: 6px; height: 6px; border-radius: 50%; background: #7fbf6a; }
.viewbtn { font-size: 12px; background: none; color: var(--cream-soft); border: 1px solid var(--rim); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
.viewbtn:hover { color: var(--cream); border-color: var(--cream-soft); }
.viewbtn.on { color: var(--cream); border-color: var(--gold); }
.tools { position: relative; }
.musicpop { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; width: 270px; background: var(--paper); color: var(--ink); border: 1px solid #a88c5f; border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 6px 0 rgba(0,0,0,.35); font-size: 14px; }
.musicpop .np { line-height: 1.4; } .musicpop .np small { display: block; color: var(--ink-soft); font-size: 12.5px; }
.musicpop .row { display: flex; gap: 8px; align-items: center; }
.musicpop input[type=range] { flex: 1; accent-color: #7a2e1d; }
.musicpop .btn { font-size: 14px; padding: 7px 12px; }
.musicpop .btn.ghost { background: var(--paper-2); color: var(--ink); border: 1px solid #a88c5f; }
.viewbtn[aria-pressed="false"] { text-decoration: line-through; text-decoration-color: #8f7b5c; }
a.viewbtn { text-decoration: none; }

/* stage */
.stage { position: relative; min-height: 0; overflow: hidden; touch-action: none; background-color: #563a22;
  background-image: repeating-linear-gradient(180deg, #5d4027 0 31px, #2c1d10 31px 32px, #553a22 32px 63px, #2c1d10 63px 64px); }
#map { position: absolute; left: -30%; top: -30%; width: 160%; height: 160%; display: block; cursor: grab; user-select: none; transform-origin: 0 0; will-change: transform; }
#map.dragging { cursor: grabbing; }
.prov { stroke: #6a5338; stroke-width: calc(var(--u) * .5px); cursor: pointer; }
.prov.gov { fill: var(--gov); } .prov.imp { fill: var(--imp); }
.prov.sep { fill: var(--sep); }
.front { pointer-events: none; }
#map.targeting .prov.valid.atk { stroke: #b5463c; stroke-width: calc(var(--u) * 2.2px); }
#map.targeting .prov.valid.land { stroke: #b5463c; stroke-width: calc(var(--u) * 2.2px); stroke-dasharray: calc(var(--u) * 5px) calc(var(--u) * 3px); }
#map.targeting .prov.valid.sea { stroke-dasharray: calc(var(--u) * 5px) calc(var(--u) * 3px); }
#map .prov.srcsel { opacity: 1 !important; stroke: #fff4c4; stroke-width: calc(var(--u) * 3px); }
.prov.gov.l1 { fill: #c99d7a; } .prov.gov.l2 { fill: #b0a06d; } .prov.gov.l3 { fill: #94a05d; } .prov.gov.op { fill: var(--sep); }
.prov:hover { stroke: #2b2117; stroke-width: calc(var(--u) * 1.4px); }
.prov.pick { stroke: #2b2117; stroke-width: calc(var(--u) * 2.2px); }
#map.targeting .prov:not(.valid) { opacity: .38; }
#map.targeting .prov.valid { stroke: #f6e08a; stroke-width: calc(var(--u) * 1.6px); }
#map.targeting .prov.valid:hover { stroke: #fff4c4; stroke-width: calc(var(--u) * 2.6px); }
.seaz { fill: transparent; stroke: var(--line); stroke-width: calc(var(--u) * 1px); stroke-dasharray: calc(var(--u) * 5px) calc(var(--u) * 4px); pointer-events: none; }
.lbl { font-family: var(--f-display); fill: var(--ink); pointer-events: none; text-anchor: middle; dominant-baseline: middle;
  paint-order: stroke; stroke: rgba(244,234,208,.75); stroke-width: calc(var(--u) * 2.5px); stroke-linejoin: round; }
.lbl.sea { font-family: var(--f-italic); font-style: italic; fill: #7c6542; stroke: none; letter-spacing: .18em; }
.lbl.city { font-family: var(--f-italic); font-style: italic; fill: #4a3a28; stroke: none; }
.flav, .city { pointer-events: none; }
.lbl.for { font-family: var(--f-italic); font-style: italic; fill: #7d715c; stroke: none; letter-spacing: .12em; }
.mk { pointer-events: none; }

/* table pieces */
.pile { position: absolute; top: 50%; transform: translateY(-50%); display: grid; justify-items: center; gap: 6px; z-index: 3; pointer-events: none; }
.pile.left { left: max(18px, env(safe-area-inset-left, 0px)); } .pile.right { right: max(18px, env(safe-area-inset-right, 0px)); }
.pile.left .stack { transform: rotate(-4deg); } .pile.right .stack { transform: rotate(5deg); }
.pile .stack { width: 74px; height: 104px; border-radius: 7px; border: 1px solid #1c140c; position: relative; }
.pile .stack.back { background: repeating-linear-gradient(45deg, #6b2f22 0 6px, #7a3829 6px 12px); box-shadow: 3px 3px 0 #1c140c, 6px 6px 0 #1c140c; }
.pile .stack.back::after { content: "N"; position: absolute; inset: 10px; border: 1px solid #c9a46a; border-radius: 4px; display: grid; place-items: center; font-family: var(--f-display); font-size: 30px; color: #e8c88c; }
.pile .stack.empty { border: 1px dashed var(--rim); box-shadow: none; }
.pile .cap { font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; color: #f0e2c0; text-shadow: 0 1px 0 #1c140c; }
.pile .num { font-size: 13px; color: #f0e2c0; text-shadow: 0 1px 0 #1c140c; font-variant-numeric: tabular-nums; }

.telegram { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; width: 250px; height: 196px; z-index: 4;
  background: #efe2c0; color: #33281c; border-radius: 2px; transform: rotate(-1.6deg); box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 0 0 1px #b39b6e;
  display: grid; grid-template-rows: auto minmax(0, 1fr); font-family: var(--f-type); }
.tg-head { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px 6px; border-bottom: 2px solid #33281c; font-size: 15px; letter-spacing: .14em; }
.tg-head small { font-size: 11px; letter-spacing: .04em; color: #6f5b40; }
.tg-body { overflow-y: auto; padding: 6px 12px 8px; font-size: 12.5px; line-height: 1.45; }
.tg-body p { margin: 0 0 4px; }
.tg-body p .t { color: #8a7454; margin-right: 4px; }
.tg-body p b { font-weight: 400; text-decoration: underline; text-underline-offset: 2px; }
.tg-body p.gov b { color: #8c3b2c; } .tg-body p.sep b { color: #3f5e2c; } .tg-body p.imp b { color: #8a5216; }
.tg-body .stop { color: #8a7454; }
.ledger { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: 14px; width: 232px; min-height: 120px; z-index: 4;
  background: #2f4a2a; border-radius: 6px; padding: 8px; transform: rotate(1.2deg); box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.ledger-in { background: #f3e9cf; color: var(--ink); border-radius: 2px; padding: 10px 12px; display: grid; gap: 8px;
  background-image: repeating-linear-gradient(transparent 0 21px, #cdbb93 21px 22px); }
.ledger-in h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 15px; letter-spacing: .06em; color: var(--ink); }
.points { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.points i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #8a6a2a; }
.points i.on { background: #c9a24a; }
.btn { border: 0; border-radius: 5px; padding: 9px 14px; font-size: 15px; font-weight: 500; cursor: pointer; background: #7a2e1d; color: #f6eedb; }
.btn:hover { background: #8e3824; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid #a88c5f; }
.btn.ghost:hover { border-color: var(--ink); }
.btn.war { background: var(--sep-ink); }
.btn.war:hover { background: #4d7236; }
.btn[aria-disabled="true"] { opacity: .5; cursor: default; }
.ledger .row { display: flex; gap: 6px; flex-wrap: wrap; }
.ledger .btn { font-size: 14px; padding: 8px 12px; }
.waiting { font-family: var(--f-italic); font-style: italic; color: var(--ink-soft); font-size: 15px; line-height: 1.4; }

.hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5; max-width: min(560px, calc(100% - 32px));
  background: var(--paper); color: var(--ink); border: 1px solid #a88c5f; border-radius: 6px; padding: 8px 14px; font-size: 14px; text-align: center; }
.hint.err { background: #f3d7cf; border-color: var(--danger); color: #5a1d14; }
.hint button { margin-left: 10px; font-size: 13px; background: none; border: 1px solid #a88c5f; border-radius: 4px; padding: 2px 8px; cursor: pointer; color: var(--ink); }

.info { position: absolute; right: max(110px, calc(env(safe-area-inset-right, 0px) + 100px)); top: 12px; z-index: 5; width: 230px;
  background: var(--paper); color: var(--ink); border: 1px solid #a88c5f; border-radius: 6px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
.info h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.info .eye { font-family: var(--f-display); font-size: 11px; letter-spacing: .12em; color: var(--ink-soft); }
.info dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.info dt { color: var(--ink-soft); } .info dd { margin: 0; }
.info .x { position: absolute; right: 8px; top: 6px; background: none; border: 0; font-size: 18px; cursor: pointer; color: var(--ink-soft); }

/* hand */
.hand { position: absolute; left: 50%; bottom: 0; width: 0; height: 0; z-index: 6; transition: transform .25s ease; }
.hand.lowered { transform: translateY(120px); }
.card { position: absolute; left: -66px; bottom: -40px; width: 132px; height: 188px; border-radius: 9px; background: var(--paper); color: var(--ink);
  border: 1.5px solid #3b2c1c; box-shadow: 0 3px 0 #1c140c; display: grid; grid-template-rows: auto 66px auto 1fr; padding: 6px; gap: 4px;
  transform: translate(var(--x), calc(var(--y) + var(--lift, 0px))) rotate(var(--r)) scale(calc(var(--s, 1) * var(--bs, 1))); transform-origin: 50% 100%;
  transition: transform .18s ease, box-shadow .18s; cursor: pointer; }
.card:hover, .card:focus-visible { --lift: -70px; --s: 1.32; --r: 0deg !important; z-index: 20 !important; box-shadow: 0 8px 0 #1c140c; }
.card.sel { --lift: -86px; --s: 1.32; --r: 0deg !important; z-index: 21 !important; outline: 3px solid var(--gold); outline-offset: 1px; }
.card.poor .c-cost { background: #9a8a70; }
.c-top { display: flex; align-items: center; gap: 6px; border-radius: 5px; padding: 3px 5px 3px 3px; }
.f-gov .c-top { background: var(--gov); } .f-sep .c-top { background: #9fbf7f; } .f-imp .c-top { background: var(--imp); }
.c-cost { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--paper-2); border: 1px solid var(--ink); display: grid; place-items: center; font-weight: 500; font-size: 13px; }
.c-name { font-family: var(--f-display); font-size: 13px; line-height: 1.05; }
.c-art { background: #dccaa0; border: 1px solid #6a5338; border-radius: 3px; display: grid; place-items: center; }
.c-art svg { width: 90%; height: 90%; }
.c-type { font-family: var(--f-italic); font-style: italic; font-size: 11px; color: var(--ink-soft); text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.c-text { font-size: 11px; line-height: 1.3; text-align: center; }

/* overlays */
.overlay { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(28,20,12,.78); padding: 16px; overflow-y: auto; }
.panel { background: var(--paper); color: var(--ink); border: 1px solid #a88c5f; border-radius: 8px; width: min(520px, 100%); padding: 22px 24px; display: grid; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; letter-spacing: .03em; text-wrap: balance; }
.panel h3 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.panel p { margin: 0; line-height: 1.55; }
.panel .soft { color: var(--ink-soft); font-size: 14px; }
.panel .row { display: flex; gap: 10px; flex-wrap: wrap; }
.seats { display: grid; gap: 6px; }
.seat { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-2); }
.seat .dot { width: 12px; height: 12px; border-radius: 50%; }
.seat small { display: block; color: var(--ink-soft); font-size: 13px; }
.panel .btn.ghost { background: var(--paper-2); color: var(--ink); border-color: #a88c5f; }
.panel .btn.small { padding: 6px 12px; font-size: 14px; }
.panel .err { color: #8e2a1e; font-size: 14px; }
.panel label.check { display: flex; align-items: center; gap: 8px; font-size: 15px; cursor: pointer; }
.panel label.check input { width: 17px; height: 17px; accent-color: #7a2e1d; }

.banner { position: absolute; left: 50%; top: 42%; z-index: 26; padding: 18px 34px 16px; border: 4px double currentColor; background: rgba(244,234,208,.96); text-align: center; pointer-events: none; box-shadow: 0 10px 0 rgba(0,0,0,.35); }
.banner .b-title { font-family: 'IM Fell English SC', Georgia, serif; font-size: clamp(30px, 5vw, 58px); letter-spacing: .04em; line-height: 1.05; }
.banner .b-sub { font-family: 'IM Fell English', Georgia, serif; font-style: italic; font-size: clamp(15px, 1.8vw, 20px); color: #3b2c1c; margin-top: 6px; }
.banner.f-sep { color: #3f5e2c; } .banner.f-gov { color: #8c3b2c; } .banner.f-imp { color: #8a5216; }
.sendrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; } .sendrow .btn { padding: 2px 10px; min-width: 32px; } .sendrow b { min-width: 54px; text-align: center; }
.chip.out { opacity: .45; text-decoration: line-through; }
.spark { position: absolute; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 1px #2b2117; }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 25; overflow: hidden; }
.battle { position: absolute; width: 270px; background: rgba(36,27,18,.94); border: 1px solid #c9a24a; border-radius: 8px; padding: 10px 12px; color: #f0e2c0; font-size: 13px; display: grid; gap: 6px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.battle .row { display: flex; align-items: center; gap: 6px; }
.battle .who { width: 82px; font-family: var(--f-display); letter-spacing: .04em; }
.battle .die { width: 28px; height: 28px; border-radius: 5px; background: #f6eedb; color: #2b2117; display: grid; place-items: center; font-weight: 500; font-size: 16px; box-shadow: 0 2px 0 #1c140c; }
.battle .die.gov { background: #f3d7cf; } .battle .die.sep { background: #dbe8c9; } .battle .die.imp { background: #f6dfc0; }
.battle .tot { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 15px; }
.battle .res { text-align: center; font-family: var(--f-display); font-size: 16px; letter-spacing: .04em; }
.token { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; display: grid; place-items: center; color: #f6eedb; font-weight: 500; font-size: 13px; border: 2px solid #f4ead0; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.uprise { max-height: 52vh; overflow-y: auto; display: grid; gap: 4px; font-size: 14px; }
.uprise div { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 4px 8px; border-radius: 4px; background: var(--paper-2); }
.uprise .won { background: #dbe8c9; } .uprise b { font-weight: 500; }
.fx .card.fly { position: absolute; left: 0; top: 0; bottom: auto; transform-origin: 50% 50%; box-shadow: 0 12px 0 rgba(0,0,0,.35); transition: none; pointer-events: none; }
.ripple { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 3px solid var(--c, #e8c35a); animation: rip .9s ease-out forwards; }
.ripple.r2 { animation-delay: .18s; opacity: 0; }
@keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(5.5); opacity: 0; } }
.ftext { position: absolute; transform: translate(-50%, -100%); font-family: var(--f-display); font-size: 18px; letter-spacing: .03em; color: #fff6dc; background: rgba(43,33,23,.9);
  border: 1px solid var(--c, #e8c35a); padding: 3px 11px; border-radius: 4px; white-space: nowrap; animation: rise 2s ease-out forwards; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -60%); } 12% { opacity: 1; transform: translate(-50%, -115%); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -175%); } }
@media (prefers-reduced-motion: reduce) { .ripple, .ftext { animation-duration: 1.6s; } }
@media (max-width: 1520px) { .dip-label { display: none; } .chip { font-size: 12.5px; padding: 3px 8px; } .brand { font-size: 16px; } .turninfo { font-size: 13px; } .top { gap: 10px; } }
@media (max-width: 760px) {
  .pile, .telegram { display: none; }
  .ledger { width: auto; left: auto; transform: none; bottom: auto; top: 12px; min-height: 0; }
  .info { right: 12px; }
  .card { width: 108px; height: 160px; left: -54px; grid-template-rows: auto 48px auto 1fr; }
  .c-text { font-size: 10.5px; }
  .dip { margin-inline: 0; }
}
@media (prefers-reduced-motion: reduce) { .card, .hand { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">Nusantara 1950</div>
    <div class="turninfo" id="turninfo">Setting up</div>
    <div class="dip" aria-label="Diplomatic standing">
      <span class="dip-label">Diplomacy</span>
      <div class="dip-bar" id="dipbar"></div>
      <span class="dip-num" id="dipnum"></span>
    </div>
    <div class="rivals" id="rivals"></div>

<script>
/* On claude.ai the page gets window.claude from the viewer. On your own website it does not,
   so this stand-in offers the same calls (db, user) backed by Firebase, configured in config.js. */
const Standalone = (() => {
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  let ready = null;
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  function init() {
    if (ready) return ready;
    ready = (async () => {
      try { await load('config.js'); } catch (e) { return null; }
      const cfg = window.NUSANTARA_FIREBASE;
      if (!cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)) return null;
      await load(SDK + 'firebase-app-compat.js');
      await load(SDK + 'firebase-auth-compat.js');
      await load(SDK + 'firebase-firestore-compat.js');
      firebase.initializeApp(cfg);
      const cred = await firebase.auth().signInAnonymously();
      return { fs: firebase.firestore(), uid: cred.user.uid };
    })().catch(e => { console.error('Online play is not set up:', e); return null; });
    return ready;
  }
  async function use(name) {
    const b = await init(); if (!b) return null;
    if (name === 'db') return { doc: p => b.fs.doc(p), collection: p => b.fs.collection(p) };
    if (name === 'user') return { id: async () => b.uid, me: async () => ({ id: b.uid, name: '' }), profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, { id: i, name: '' }])), isOwner: async () => false, canEdit: async () => true, can: async () => true };
    return null;
  }
  return { use };
})();
if (!window.claude) window.claude = { use: Standalone.use };
</script>
<script>
/* ENGINE:START — pure rules, no DOM. State is plain JSON so it can be saved and shared. */
const Engine = (() => {
  const FACTIONS = ['gov', 'sep', 'imp'];
  const FNAME = { gov: 'Government', sep: 'Separatists', imp: 'Imperialists' };
  const HAND = 6, DIP_MAX = 7, DIP_START = 5, DIP_PRESSURE = 2, OUTPOSTS_FOR_WAR = 3, LOG_MAX = 80;
  const LEVEL = ['Loyal', 'Restless', 'Unrest', 'Ready to rise'];

  const CARDS = {
    search:     { name: 'Search', f: 'gov', cost: 2, target: 'prov', text: 'Learn if the rebel hideout is in one province.' },
    sweep:      { name: 'Sweep', f: 'gov', cost: 3, target: 'prov', text: 'Search a province and all its land neighbours.' },
    crackdown:  { name: 'Crackdown', f: 'gov', cost: 2, target: 'prov', text: 'Unrest −2 in a province without an outpost, if there is any. Diplomacy −1.' },
    fort:       { name: 'Build fort', f: 'gov', cost: 2, target: 'prov', text: 'Unrest cannot rise in this province.' },
    destroy:    { name: 'Destroy outpost', f: 'gov', cost: 3, target: 'prov', text: 'Remove an outpost. The province drops to Restless.' },
    mission:    { name: 'Diplomatic mission', f: 'gov', cost: 2, target: null, text: 'Diplomacy +1.' },
    repair:     { name: 'Repair port', f: 'gov', cost: 1, target: 'prov', text: 'A wrecked port works again.' },
    propaganda: { name: 'Propaganda', f: 'sep', cost: 1, target: 'prov', text: 'Unrest +1 within 2 provinces of your hideout or an outpost.' },
    raid:       { name: 'Raid', f: 'sep', cost: 2, target: 'prov', text: 'Unrest +2 in a province that is already Restless.' },
    ssab:       { name: 'Sabotage', f: 'sep', cost: 2, target: 'prov', text: 'In a Restless province: destroy its fort, or else wreck its port.' },
    outpost:    { name: 'Establish outpost', f: 'sep', cost: 3, target: 'prov', text: 'In a province that is Ready to rise.' },
    relocate:   { name: 'Relocate hideout', f: 'sep', cost: 3, target: 'prov', text: 'Secretly move your hideout.' },
    supplies:   { name: 'Smuggled supplies', f: 'sep', cost: 0, target: null, text: '+2 points this turn. A gift from abroad.' },
    smear:      { name: 'Smear campaign', f: 'imp', cost: 1, target: null, text: 'Diplomacy −1.' },
    isab:       { name: 'Sabotage', f: 'imp', cost: 2, target: 'prov', text: 'Anywhere: destroy a fort, or else wreck a port.' },
    arms:       { name: 'Arms shipment', f: 'imp', cost: 2, target: null, text: 'Give the separatists a Smuggled supplies card.' },
    spy:        { name: 'Spy network', f: 'imp', cost: 2, target: null, text: 'The government discards a random card.' },
  };
  const DECKS = {
    gov: { search: 4, sweep: 1, crackdown: 4, fort: 3, destroy: 3, mission: 4, repair: 2 },
    sep: { propaganda: 8, raid: 4, ssab: 3, outpost: 4, relocate: 2 },
    imp: { smear: 3, isab: 5, arms: 4, spy: 4 },
  };

  let MAP = null;           // { provinces: [{id,name,owner,neighbors}], ports: [{province,name}] }
  let byId = {};
  function init(map) {
    MAP = map; byId = {};
    map.provinces.forEach(p => byId[p.id] = p);
    setSeas(map.seas);
  }
  const nameOf = id => (byId[id] ? byId[id].name : id);
  const hasPort = id => MAP.ports.some(p => p.province === id);

  function shuffle(a, rng) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function draw(S, f, n, rng) {
    for (let k = 0; k < n; k++) {
      if (!S.decks[f].length) {
        if (!S.discards[f].length) return;
        S.decks[f] = shuffle(S.discards[f], rng); S.discards[f] = [];
      }
      S.hands[f].push(S.decks[f].pop());
    }
  }
  function log(S, f, text) {
    S.log.push({ t: S.turn, f, text });
    if (S.log.length > LOG_MAX) S.log.splice(0, S.log.length - LOG_MAX);
  }
  function basePoints(S, f) {
    if (f === 'gov') return S.diplomacy <= DIP_PRESSURE ? 3 : 4;
    return 3;
  }

  function newGame(rng = Math.random) {
    const S = {
      v: 1, id: Math.random().toString(36).slice(2, 10),
      phase: 'setup', turn: 1, active: 'sep',
      points: { gov: 0, sep: 0, imp: 0 }, diplomacy: DIP_START,
      prov: {}, ports: {},
      hands: { gov: [], sep: [], imp: [] }, decks: {}, discards: { gov: [], sep: [], imp: [] },
      log: [], pending: null, winner: null,
      seats: { gov: null, sep: null, imp: null },
    };
    MAP.provinces.forEach(p => S.prov[p.id] = { loy: 0, fort: false, outpost: false, searched: 0 });
    MAP.ports.forEach(p => S.ports[p.province] = { broken: false });
    FACTIONS.forEach(f => {
      const d = [];
      Object.entries(DECKS[f]).forEach(([c, n]) => { for (let i = 0; i < n; i++) d.push(c); });
      S.decks[f] = shuffle(d, rng);
      draw(S, f, HAND, rng);
    });
    log(S, null, 'A new game begins. The separatists choose a secret hideout.');
    return S;
  }

  const republic = S => MAP.provinces.filter(p => p.owner === 'gov').map(p => p.id);
  const outposts = S => Object.keys(S.prov).filter(id => S.prov[id].outpost);

  function hideoutChoices(S) { return republic(S).filter(id => id !== 'jakarta'); }

  function chooseHideout(S) {
    S.phase = 'play'; S.active = 'gov'; S.turn = 1;
    S.points.gov = basePoints(S, 'gov');
    log(S, 'sep', 'The separatists have gone into hiding.');
  }

  function within(sources, steps) {
    const seen = new Set(sources), q = sources.map(s => [s, 0]);
    while (q.length) {
      const [id, d] = q.shift();
      if (d === steps) continue;
      (byId[id].neighbors || []).forEach(n => { if (!seen.has(n)) { seen.add(n); q.push([n, d + 1]); } });
    }
    return seen;
  }

  /* Which provinces a card may target. null = needs no target. `secret` = hideout id or null. */
  function targets(S, card, secret) {
    const c = CARDS[card]; if (!c.target) return null;
    const R = republic(S), P = S.prov;
    const RS = R.filter(id => id !== 'jakarta');   // the separatists can never act in the capital
    const canRise = id => !P[id].fort && !P[id].outpost && P[id].loy < 3;
    const portOk = id => hasPort(id) && !S.ports[id].broken;
    switch (card) {
      case 'search': case 'sweep': return R.filter(id => id !== 'jakarta');
      case 'crackdown': return R.filter(id => !P[id].outpost);   // blind: the government can't see unrest (outposts are public: use Destroy outpost there)
      case 'fort': return R.filter(id => !P[id].fort && !P[id].outpost);
      case 'destroy': return R.filter(id => P[id].outpost);
      case 'repair': return R.filter(id => hasPort(id) && S.ports[id].broken);
      case 'propaganda': {
        const src = [...outposts(S)]; if (secret) src.push(secret);
        if (!src.length) return [];
        const near = within(src, 2);
        return RS.filter(id => near.has(id) && canRise(id));
      }
      case 'raid': return RS.filter(id => P[id].loy >= 1 && canRise(id));
      case 'ssab': return RS.filter(id => P[id].loy >= 1 && (P[id].fort || portOk(id)));
      case 'outpost': return RS.filter(id => P[id].loy === 3 && !P[id].outpost);
      case 'relocate': return hideoutChoices(S).filter(id => id !== secret);
      case 'isab': return R.filter(id => P[id].fort || portOk(id));
    }
    return [];
  }

  /* Plays hand[idx] for the active faction. Returns { error } or { secret } (new hideout, if moved).
     For searches: if `secret` is known the answer is immediate; otherwise S.pending is set and
     the separatist player's browser must answer it. */
  function play(S, idx, target, secret, rng = Math.random, tab = '') {
    if (S.phase !== 'play') return { error: 'The game is not in progress.' };
    if (S.pending) return { error: 'Waiting for an answer.' };
    const f = S.active, card = S.hands[f][idx];
    if (!card) return { error: 'No such card.' };
    const c = CARDS[card];
    if (c.cost > S.points[f]) return { error: `${c.name} costs ${c.cost}. You have ${S.points[f]} left.` };
    const valid = targets(S, card, secret);
    if (valid && !valid.includes(target)) return { error: `${c.name} can't target that province.` };

    S.points[f] -= c.cost;
    S.hands[f].splice(idx, 1);
    if (card !== 'supplies') S.discards[f].push(card);
    const P = S.prov, at = target && P[target], nm = target && nameOf(target);
    let out = {};
    switch (card) {
      case 'search': ask(S, 'search', [target], secret, tab); break;
      case 'sweep': ask(S, 'sweep', [target, ...byId[target].neighbors.filter(n => byId[n].owner === 'gov')], secret, tab); break;
      case 'crackdown': at.loy = Math.max(0, at.loy - 2); S.diplomacy = Math.max(0, S.diplomacy - 1);
        if (S.intel && S.intel[target]) S.intel[target] = { loy: at.loy, t: S.turn };
        log(S, f, `Crackdown in ${nm}. The world disapproves (diplomacy −1).`); break;
      case 'fort': at.fort = true; log(S, f, `A fort rises in ${nm}.`); break;
      case 'destroy': at.outpost = false; at.loy = 1; log(S, f, `The outpost in ${nm} is destroyed.`); break;
      case 'mission': S.diplomacy = Math.min(DIP_MAX, S.diplomacy + 1); log(S, f, 'A diplomatic mission improves relations (diplomacy +1).'); break;
      case 'repair': S.ports[target].broken = false; log(S, f, `The port in ${nm} is repaired.`); break;
      case 'propaganda': at.loy = Math.min(3, at.loy + 1); log(S, f, 'Rebel propaganda spreads somewhere.'); break;
      case 'raid': at.loy = Math.min(3, at.loy + 2); log(S, f, 'Rebels raid somewhere in the Republic.'); break;
      case 'ssab': case 'isab':
        if (at.fort) { at.fort = false; log(S, f, `The fort in ${nm} is sabotaged.`); }
        else { S.ports[target].broken = true; log(S, f, `The port in ${nm} is wrecked.`); }
        break;
      case 'outpost': at.outpost = true; log(S, f, `The separatists establish an outpost in ${nm}.`); break;
      case 'relocate': out.secret = target; log(S, f, 'The separatists move their hideout.'); break;
      case 'supplies': S.points.sep += 2; log(S, f, 'Smuggled supplies arrive (+2 points).'); break;
      case 'smear': S.diplomacy = Math.max(0, S.diplomacy - 1); log(S, f, 'A smear campaign hurts the Republic abroad (diplomacy −1).'); break;
      case 'arms': S.hands.sep.push('supplies'); log(S, f, 'A secret arms shipment heads for the rebels.'); break;
      case 'spy': {
        const h = S.hands.gov;
        if (h.length) { const k = Math.floor(rng() * h.length); const lost = h.splice(k, 1)[0]; S.discards.gov.push(lost); log(S, f, `Dutch spies steal government plans (${CARDS[lost].name} discarded).`); }
        else log(S, f, 'Dutch spies find nothing to steal.');
        break;
      }
    }
    const secretMove = card === 'relocate' || card === 'propaganda' || card === 'raid';
    stamp(S, { f, card, target: secretMove ? null : target });   // never reveal where the rebels worked
    checkEnd(S);
    return out;
  }
  function stamp(S, last) { S.seq = (S.seq || 0) + 1; S.last = { seq: S.seq, ...last }; }

  function ask(S, kind, provs, secret, tab) {
    if (secret !== undefined && secret !== null) { resolveSearch(S, provs, provs.includes(secret) ? secret : 'none', kind); return; }
    S.pending = { kind, provs, by: tab, q: Math.random().toString(36).slice(2, 8) };
    log(S, 'gov', `${kind === 'sweep' ? 'Sweeping' : 'Searching'} ${provs.map(nameOf).join(', ')}…`);
  }
  /* Called by the browser that knows the hideout. Returns the province found, or 'none'. */
  function answerFor(S, secret) { return S.pending.provs.includes(secret) ? secret : 'none'; }
  function resolveSearch(S, provs, found, kind = (S.pending && S.pending.kind) || 'search') {
    S.intel = S.intel || {};
    provs.forEach(id => { S.prov[id].searched = S.turn; S.intel[id] = { loy: S.prov[id].loy, t: S.turn }; });
    S.pending = null;
    stamp(S, { f: 'gov', card: 'result', via: kind, target: found && found !== 'none' ? found : provs[0], found: !!(found && found !== 'none') });
    if (found && found !== 'none') {
      log(S, 'gov', `The hideout is found in ${nameOf(found)}! The rebels are forced to rise early.`);
      startWar(S, Math.random, { trigger: 'found', hideout: found });
    } else log(S, 'gov', `Nothing found in ${provs.map(nameOf).join(', ')}.`);
  }

  function discard(S, idx) {
    const f = S.active;
    if ((S.phase !== 'play' && S.phase !== 'war') || S.pending) return { error: 'You cannot discard now.' };
    if (S.points[f] < 1) return { error: 'Discarding costs 1 point.' };
    const card = S.hands[f].splice(idx, 1)[0]; if (!card) return { error: 'No such card.' };
    S.points[f] -= 1;
    if (card !== 'supplies') S.discards[f].push(card);
    log(S, f, `${FNAME[f]} discard a card.`);
    return {};
  }

  function canDeclareWar(S) { return S.phase === 'play' && S.active === 'sep' && !S.pending && outposts(S).length >= OUTPOSTS_FOR_WAR; }
  function declareWar(S, rng = Math.random) {
    if (!canDeclareWar(S)) return { error: `You need ${OUTPOSTS_FOR_WAR} outposts to declare civil war.` };
    log(S, 'sep', 'The separatists declare civil war!');
    startWar(S, rng, { trigger: 'declare' });
    return {};
  }

  /* Run by the browser that knows the hideout, once S.phase is 'invasion'. */
  function invade(S, secret, rng = Math.random) {
    if (S.phase !== 'invasion') return { error: 'There is no invasion.' };
    startWar(S, rng, { trigger: 'dutch', hideout: secret });
    return {};
  }
  function checkEnd(S) {
    if (S.phase === 'play' && S.diplomacy <= 0) {
      log(S, 'imp', 'The Republic is isolated. The Dutch invade!');
      S.phase = 'invasion'; S.pending = null;
    }
  }

  function endTurn(S, rng = Math.random) {
    if (S.phase !== 'play' || S.pending) return { error: 'You cannot end the turn now.' };
    const f = S.active;
    const need = HAND - S.hands[f].length; if (need > 0) draw(S, f, need, rng);
    const next = FACTIONS[(FACTIONS.indexOf(f) + 1) % 3];
    if (next === 'gov') S.turn++;
    S.active = next;
    S.points[next] = basePoints(S, next);
    return {};
  }

  /* ================= PHASE 2: CIVIL WAR =================
     Every province has an owner, troops and 3 control points. Attacks are push-and-pull:
     an attacker win takes a control point (at 0 the province falls), a defender win kills an attacking troop. */
  const WAR = { KEEP: 0, ROUNDS: 15, PORT_LIFT: 6, PTS_GAIN: 1, PTS_GAIN_DUTCH: 2, PTS_JAKARTA: 4, PTS_OUTPOST: 1, CAPITAL: 6, GOV_SUPPLY: 10, SEP_SUPPLY: 4, DUTCH_SUPPLY: 16, MASSED: 5, PORT_HOP: 1, CONTROL: 3, MAX_DICE: 3, MAX_DEF: 3, GOV_PTS: 8, SEP_PTS: 6, IMP_PTS: 4, GOV_DIV: 4, SEP_DIV: 4, DRAIN: 2, DUTCH_FORCE: 5, DUTCH_REINF: 3, INVASION_EXTRA: 4, HIDEOUT_TROOPS: 5, SIEGE_TROOPS: 2, FORT: 2, ENTRENCH: 2, DEF_CAP: 2, AIR: 2, BEACH: -2, SEA_LIFT: 4, BIG_LIFT: 8, WAR_DIP_HIT: 2, HAND: 5 };
  Object.assign(CARDS, {
    w_reinforce: { name: 'Reinforcements', f: 'gov', cost: 2, target: 'own', war: true, text: '+3 troops in a province you hold, up to your supply limit.' },
    w_air:       { name: 'Air strike', f: 'gov', cost: 1, target: null, war: true, text: 'Your next attack this turn gets +2.' },
    w_fort:      { name: 'Fortify', f: 'gov', cost: 2, target: 'own', war: true, text: 'Build a fort: +2 when defending.' },
    w_mission:   { name: 'Diplomatic mission', f: 'gov', cost: 2, target: null, war: true, text: 'Diplomacy +1.' },
    w_transport: { name: 'Naval transport', f: 'any', cost: 1, target: null, war: true, text: 'Your next sea move or landing this turn is free, carries up to 8 troops and has no beach penalty.' },
    w_recruit:   { name: 'Recruit', f: 'sep', cost: 2, target: 'own', war: true, text: '+3 troops in a province you hold, up to your supply limit.' },
    w_massed:    { name: 'Massed assault', f: 'any', cost: 1, target: null, war: true, text: 'Your next attack this turn rolls up to 5 dice.' },
    w_entrench:  { name: 'Entrench', f: 'sep', cost: 1, target: 'own', war: true, text: '+2 when defending this province until your next turn.' },
    w_outpost:   { name: 'Establish outpost', f: 'sep', cost: 3, target: 'own', war: true, text: 'A new outpost in a province you fully control.' },
    w_hitrun:    { name: 'Hit and run', f: 'sep', cost: 1, target: null, war: true, text: 'This turn, your first failed attack costs no troop.' },

  /* ---------- war bot: any faction, no hidden information needed ---------- */

  if (text) { const d = h('div', 'ftext', text); d.style.cssText = `left:${x}px;top:${y - 14}px;--c:${col}`; fx.append(d); setTimeout(() => d.remove(), 2100); }
}
/* effects play one after another, so a quick answer never overtakes the card that asked for it */
let fxQ = [], fxBusy = false;
function queueFx(...args) { fxQ.push(args); if (!fxBusy) nextFx(); }
function nextFx() { const a = fxQ.shift(); if (!a) { fxBusy = false; return; } fxBusy = true; playFx(...a, () => setTimeout(nextFx, 450)); }
function battleFx(last, done) {
  const [tx, ty] = targetPoint(last), r = rect(), fx = $('fx');
  const box = h('div', 'battle');
  box.style.left = Math.max(8, Math.min(r.width - 286, tx - 135)) + 'px';
  box.style.top = Math.max(8, Math.min(r.height - 170, ty - 170)) + 'px';
  const side = (f, dice, bonus) => {
    const row = h('div', 'row'); row.append(h('span', 'who', FN[f]));
    const ds = dice.map(() => { const d = h('div', 'die ' + f, '?'); row.append(d); return d; });
    if (bonus) row.append(h('span', null, (bonus > 0 ? '+' : '') + bonus));
    const tot = h('span', 'tot', ''); row.append(tot);
    box.append(row); return { ds, tot, dice, bonus };
  };
  const A = side(last.f, last.ad, last.ab), Dd = side(last.def, last.dd, last.db);
  const res = h('div', 'res', `${FN[last.f]} attack ${PROV[last.target].name}`); box.append(res);
  fx.append(box);
  Music.sfx('raid');
  let n = 0;
  const settle = () => {
    [A, Dd].forEach(s => { s.ds.forEach((d, i) => d.textContent = s.dice[i]); s.tot.textContent = s.dice.reduce((x, y) => x + y, 0) + (s.bonus || 0); });
    const pl = n => `${n} ${n === 1 ? 'troop' : 'troops'}`;
    res.textContent = last.captured ? (prevEnc[last.target] ? `The ${PROV[last.target].name} pocket is eliminated!` : `${PROV[last.target].name} falls!`) : last.win && last.dl ? `Defenders lose ${pl(last.dl)}${last.troops ? '' : ': undefended!'}` : last.win ? `The front pushes forward (${last.control} control left)` : `The defence holds${last.saved ? ', no losses' : `: attackers lose ${pl(last.al || 1)}`}`;
    res.style.color = last.win ? FX_COLOR[last.f] : FX_COLOR[last.def];
    if (last.captured) burstFx(last);
    landFx({ ...last, card: last.captured ? 'outpost' : last.win ? 'crackdown' : 'result', found: false }, tx, ty, last.captured ? (prevEnc[last.target] ? 'Pocket eliminated!' : 'Captured!') : last.win && last.dl ? `−${last.dl}` : last.win ? 'Push!' : last.al > 1 ? `Holds, −${last.al}` : 'Holds');
    setTimeout(() => { box.remove(); done(); }, 1500);
  };
  if (reduceMotion()) { settle(); return; }
  const spin = setInterval(() => {
    [A, Dd].forEach(s => s.ds.forEach(d => d.textContent = 1 + Math.floor(Math.random() * 6)));
    if (++n >= 9) { clearInterval(spin); settle(); }
  }, 75);
}
function moveFx(last, done) {
  const [sx, sy] = targetPoint({ target: last.src }), [tx, ty] = targetPoint(last), fx = $('fx');
  const tok = h('div', 'token', String(last.n)); tok.style.background = INK[last.f]; tok.style.left = '0px'; tok.style.top = '0px'; fx.append(tok);
  Music.sfx(last.card === 'march' ? 'relocate' : 'whoosh');
  const finish = () => { tok.remove(); landFx({ ...last, card: last.card === 'land' ? 'land' : 'move' }, tx, ty, last.card === 'land' ? 'Landing!' : last.card === 'sea' ? 'By sea' : null); done(); };
  if (reduceMotion()) { finish(); return; }
  const anim = tok.animate([{ transform: `translate(${sx}px, ${sy}px)` }, { transform: `translate(${tx}px, ${ty}px)` }], { duration: last.card === 'march' ? 550 : 900, easing: 'ease-in-out', fill: 'forwards' });
  anim.onfinish = finish;
}
const SFXFOR = { w_reinforce: 'raid', w_recruit: 'raid', w_air: 'sweep', w_fort: 'fort', w_mission: 'mission', w_transport: 'whoosh', w_entrench: 'fort', w_outpost: 'outpost', w_hitrun: 'relocate', w_agitate: 'propaganda', w_blockade: 'destroy', w_legion: 'arms', w_massed: 'sweep' };
function playFx(last, own, fly, from, done) {
  if (last.card === 'battle') { battleFx(last, done); return; }
  if (last.card === 'march' || last.card === 'sea' || last.card === 'land') { moveFx(last, done); return; }
  if (last.card === 'uprising') { done(); return; }
  const [tx, ty] = targetPoint(last), r = rect();
  const card = last.card === 'result' ? last.via : last.card;
  if (!fly || !card || reduceMotion()) { landFx(last, tx, ty); done(); return; }
  Music.sfx('whoosh');
  const c = cardEl(card, last.f); c.classList.add('fly'); c.removeAttribute('tabindex'); $('fx').append(c);
  const at = (x, y, s, rot = 0) => `translate(${(x - 66).toFixed(1)}px, ${(y - 94).toFixed(1)}px) rotate(${rot}deg) scale(${s})`;
  const [sx, sy] = own && from ? from : [r.width / 2, -40];
  // hold the card beside its target, so the pulsing province stays visible
  const mid = [last.target && PROV[last.target] ? (tx < r.width / 2 ? r.width * .7 : r.width * .3) : r.width / 2, Math.min(r.height * .42, r.height - 200)];
  const frames = own
    ? [{ transform: at(sx, sy, 1.2), opacity: 1 }, { transform: at(tx, ty, .22, 8), opacity: .15 }]
    : [{ transform: at(sx, sy, .7), opacity: 0 }, { transform: at(mid[0], mid[1], 1.3), opacity: 1, offset: .14 },
       { transform: at(mid[0], mid[1], 1.3), opacity: 1, offset: .78 }, { transform: at(tx, ty, .22, 8), opacity: .15 }];
  // someone else's card: it stays up longer, and the province it targets (if that is public) pulses meanwhile
  if (!own && last.target && PROV[last.target]) highlightProv(last.target, INK[last.f] || '#3b2c1c', 2700);
  const anim = c.animate(frames, { duration: own ? 620 : 2500, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' });
  anim.onfinish = () => { c.remove(); landFx(last, tx, ty); done(); };
}
/* called after every render: animate any action this screen has not shown yet */
function checkFx() {
  if (!S) return;
  const seq = S.last ? S.last.seq : 0;
  if (lastSeen === null) { lastSeen = seq; return; }
  if (!S.last || seq <= lastSeen) return;
  const jumped = S.last.seq - lastSeen > 1;
  lastSeen = S.last.seq;
  if (S.last.card === 'uprising') warBanner(S.last.trigger || 'declare', S.last.list);
  if (passTo !== null) return;
  const own = viewF === S.last.f && mine(S.last.f);
  const fly = S.last.card !== 'result' || jumped;
  queueFx(S.last, own, fly, flyFrom);
  flyFrom = null;
}

/* ---------- bot ---------- */
let botTimer = 0, botPlays = 0;
function botHost() {
  if (mode === 'local') return passTo === null;
  if (mode !== 'online' || !S) return false;
  const first = F.find(f => S.seats[f] && !S.seats[f].bot);
  return !!first && S.seats[first].key === net.key;
}
function maybeRunBot() {
  if (botTimer || !S || (S.phase !== 'play' && S.phase !== 'war') || S.pending || !isBot(S.active) || !botHost() || uprisingShow || bannerOn) return;
  if (S.phase === 'war') {
    const peek = E.warBot(S);
    botTimer = setTimeout(() => {
      botTimer = 0;
      if (fxBusy) { maybeRunBot(); return; }   // let the last move finish playing first
      if (!S || S.phase !== 'war' || !isBot(S.active) || !botHost()) return;
      const m = botPlays < 40 ? E.warBot(S) : null;
      if (m) { botPlays++; act(() => E.applyWarBot(S, m)); }
      else { botPlays = 0; act(() => E.warEndTurn(S), true); }
    }, peek && peek.kind === 'place' ? 350 : fxBusy ? 1900 : 1200);
    return;
  }
  botTimer = setTimeout(() => {
    botTimer = 0;
    if (fxBusy) { maybeRunBot(); return; }
    if (!S || S.phase !== 'play' || S.pending || !isBot(S.active) || !botHost()) return;
    const f = S.active, sec = f === 'sep' ? secret : null;
    const m = botPlays < 6 ? E.phase1Bot(S, sec) : null;
    if (m && m.declare) { botPlays = 0; act(() => E.declareWar(S), true); }
    else if (m) { botPlays++; act(() => E.play(S, m.idx, m.target, f === 'sep' ? secret : undefined, Math.random, tab)); }
    else { botPlays = 0; act(() => E.endTurn(S), true); }
  }, fxBusy ? 1900 : 1300);
}

/* ---------- boot ---------- */
requestAnimationFrame(() => { fitAll(); render(); });
setupOnline();
</script>
